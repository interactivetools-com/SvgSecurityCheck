<!-- rejected: the xlink prefix bound to a metadata namespace, which an HTML parser would read as a working XLink href -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://ns.adobe.com/x" viewBox="0 0 10 10">
  <a xlink:href="javascript:alert(1)"><rect width="10" height="10"/></a>
</svg>
